name: Build Theos package

on:
  push:
    branches:
      - weatherground/ipad-ios12
  pull_request:
    branches:
      - weatherground/ipad-ios12

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang lzma dpkg-dev debhelper libssl-dev libz-dev

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build package with Theos
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -e
          make package

      - name: Collect .deb artifacts
        run: |
          mkdir -p artifacts
          cp packages/*.deb artifacts/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weatherground-debs
          path: artifacts
