name: Build Theos package

on:
  push:
    branches:
      - weatherground/ipad-ios12
  pull_request:
    branches:
      - weatherground/ipad-ios12

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang lzma dpkg-dev debhelper libssl-dev libz-dev curl

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iPhoneOS12.4 SDK (from secret IOS12_SDK_URL)
        env:
          THEOS: ${{ env.THEOS }}
          IOS12_SDK_URL: ${{ secrets.IOS12_SDK_URL }}
        run: |
          set -e
          SDK_DIR="$HOME/theos/sdks/iPhoneOS12.4.sdk"
          if [ -d "$SDK_DIR" ]; then
            echo "iPhoneOS12.4 SDK already present"
          else
            if [ -z "$IOS12_SDK_URL" ]; then
              echo "ERROR: Secret IOS12_SDK_URL is not set. Please add a repository secret that points to a downloadable iPhoneOS12.4 SDK tarball (e.g., https://example.com/iPhoneOS12.4.sdk.tar.gz)" >&2
              exit 1
            fi
            echo "Downloading iPhoneOS12.4 SDK from secret URL..."
            curl -L "$IOS12_SDK_URL" -o /tmp/iphoneos12.tar.gz
            mkdir -p "$HOME/theos/sdks"
            tar -xzf /tmp/iphoneos12.tar.gz -C "$HOME/theos/sdks"
            echo "Installed SDK to $HOME/theos/sdks"
          fi

      - name: Build package with Theos
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -e
          make package

      - name: Collect .deb artifacts
        run: |
          mkdir -p artifacts
          cp packages/*.deb artifacts/ || true

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.4
          release_name: "WeatherGround v1.4 (iOS 12)"
          body: "Built by GitHub Actions (Theos) for iOS 12.4 compatibility. Artifacts attached."
          draft: false
          prerelease: false

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if compgen -G "artifacts/*.deb" > /dev/null; then
            for f in artifacts/*.deb; do
              filename=$(basename "$f")
              echo "Uploading $filename to release"
              upload_url="${{ steps.create_release.outputs.upload_url }}?name=$filename"
              curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$f" "$upload_url"
            done
          else
            echo "No .deb artifacts found to upload"
          fi

      - name: Upload artifact (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: weatherground-debs
          path: artifacts
