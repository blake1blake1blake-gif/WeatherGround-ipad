name: Build Theos package

on:
  push:
    branches:
      - weatherground/ipad-ios12
  pull_request:
    branches:
      - weatherground/ipad-ios12

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          brew update || true
          brew install dpkg ldid || true

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          # Init vendor submodules (dm.pl and others) so symlinks in $THEOS/bin are valid
          git -C $HOME/theos submodule update --init --recursive || true
          # Make sure dm.pl is executable if present
          if [ -f "$HOME/theos/vendor/dm.pl/dm.pl" ]; then
            chmod +x "$HOME/theos/vendor/dm.pl/dm.pl" || true
          fi
          if [ -f "$HOME/theos/bin/dm.pl" ]; then
            chmod +x "$HOME/theos/bin/dm.pl" || true
          fi

      - name: Setup THEOS environment and verify dm.pl
        run: |
          # Export THEOS and prepend its bin to PATH for subsequent steps
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV

          echo "Listing $HOME/theos/bin"
          ls -la $HOME/theos/bin || true

          if [ ! -f "$HOME/theos/bin/dm.pl" ]; then
            echo "ERROR: dm.pl not found at $HOME/theos/bin/dm.pl" >&2
            exit 1
          fi

          echo "dm.pl found — proceeding"

      - name: Build package with Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS"
          echo "PATH=$PATH"
          which dm.pl || true
          make package

      - name: Collect .deb artifacts
        run: |
          mkdir -p artifacts
          cp packages/*.deb artifacts/ || true

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.4
          release_name: "WeatherGround v1.4 (iOS 12)"
          body: "Built by GitHub Actions (Theos) for iOS 12.4 compatibility. Artifacts attached."
          draft: false
          prerelease: false

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if compgen -G "artifacts/*.deb" > /dev/null; then
            for f in artifacts/*.deb; do
              filename=$(basename "$f")
              echo "Uploading $filename to release"
              upload_url="${{ steps.create_release.outputs.upload_url }}?name=$filename"
              curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$f" "$upload_url"
            done
          else
            echo "No .deb artifacts found to upload"
          fi

      - name: Upload artifact (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: weatherground-debs
          path: artifacts
